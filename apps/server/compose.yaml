services:
  postgres:
    image: postgres:16
    container_name: tream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tream-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tream"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tream-postgres-data:
